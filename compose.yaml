name: monorepo-template

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: monorepo-template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monorepo-template"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  database:
